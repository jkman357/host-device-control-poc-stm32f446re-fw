name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm make
      - run: python3 Tools/check_coding_rules.py
      - run: python3 Tools/validate_project.py
      - run: make host-test
      - run: python3 Tests/test_validate_project.py
      - run: python3 Tools/protocol_command_sweep.py --self-test
      - run: python3 Tools/test_linker_layout.py
      - run: bash Tools/build_all_baud_profiles.sh
