# Host-Device Control PoC shared PC/MCU wire contract.
# This file is the project-level source of truth. Implementation code is not authoritative.

protocol:
  name: host-device-control-poc
  version: 0.1.0
  wire_version: 0x01
  status: candidate_for_alignment
  lifecycle:
    allowed_statuses:
      - draft
      - candidate_for_alignment
      - implementation_aligned
      - verified_baseline
      - deprecated
    promotion_rule: >-
      Promotion to verified_baseline requires matching PC and MCU implementations,
      passing shared test vectors, hardware interoperability evidence, pinned commits,
      and human approval recorded in this repository.
  authority:
    repository: host-device-control-poc-system
    path: protocol/protocol.yaml
    rule: specification_precedes_implementation
  byte_order: little_endian
  text_encoding: utf_8
  scalar_encoding:
    unsigned_integers: little_endian
    float32: ieee_754_binary32_little_endian
    crc16_storage: little_endian

transport_profile:
  name: st_link_vcp_uart
  physical_path: st_link_virtual_com_port
  baud_rate_bps: 115200
  data_bits: 8
  parity: none
  stop_bits: 1
  flow_control: none
  duplex: full_duplex

framing:
  sof:
    bytes: [0xA5, 0x5A]
    included_in_crc: false
  fields:
    - name: version
      offset_bytes: 2
      type: uint8
      size_bytes: 1
    - name: message_id
      offset_bytes: 3
      type: uint8
      size_bytes: 1
    - name: sequence
      offset_bytes: 4
      type: uint16
      size_bytes: 2
      byte_order: little_endian
    - name: payload_length
      offset_bytes: 6
      type: uint16
      size_bytes: 2
      byte_order: little_endian
    - name: payload
      offset_bytes: 8
      type: byte_array
      size_bytes: payload_length
    - name: crc16
      offset_bytes: 8_plus_payload_length
      type: uint16
      size_bytes: 2
      byte_order: little_endian
  minimum_frame_size_bytes: 10
  maximum_payload_size_bytes: 1024
  crc:
    algorithm: crc_16_ccitt_false
    polynomial: 0x1021
    initial_value: 0xFFFF
    reflect_input: false
    reflect_output: false
    xor_output: 0x0000
    covered_bytes: version_through_end_of_payload
    check_vector:
      input_ascii: "123456789"
      expected: 0x29B1
  receiver_resynchronization:
    invalid_crc: discard_candidate_and_search_next_sof
    invalid_length: discard_candidate_and_search_next_sof
    unsupported_version: reject_decodable_request
    partial_frame_timeout: discard_partial_frame

sequence_rules:
  host_command:
    width_bits: 16
    zero_allowed: false
    allocation: monotonically_incrementing_with_wrap_from_0xffff_to_1
  direct_response:
    copies_request_sequence: true
  unsolicited_device_message:
    width_bits: 16
    allocation: independent_monotonically_incrementing_with_wrap
  telemetry_loss_detection:
    primary_field: payload.sample_counter
    wraparound: uint32

state_model:
  initial_state: idle
  states:
    - { name: idle, value: 0x00 }
    - { name: streaming, value: 0x01 }
  transitions:
    - command: START_STREAM
      allowed_from: [idle]
      success_state: streaming
    - command: STOP_STREAM
      allowed_from: [streaming]
      success_state: idle
  invalid_transition_result: INVALID_STATE

messages:
  - name: PING
    id: 0x01
    direction: pc_to_mcu
    kind: command
    allowed_states: [idle, streaming]
    payload: []
    valid_responses: [ACK, NACK]

  - name: GET_DEVICE_INFO
    id: 0x02
    direction: pc_to_mcu
    kind: command
    allowed_states: [idle, streaming]
    payload: []
    valid_responses: [DEVICE_INFO, NACK]

  - name: SET_STREAM_CONFIG
    id: 0x03
    direction: pc_to_mcu
    kind: command
    allowed_states: [idle]
    payload:
      - name: interval_us
        type: uint16
        unit: microsecond
        valid_range: [1000, 60000]
        poc_default: 5000
    valid_responses: [ACK, NACK]

  - name: START_STREAM
    id: 0x04
    direction: pc_to_mcu
    kind: command
    allowed_states: [idle]
    payload: []
    valid_responses: [ACK, NACK]
    success_effect: enter_streaming_and_reset_stream_counters

  - name: STOP_STREAM
    id: 0x05
    direction: pc_to_mcu
    kind: command
    allowed_states: [streaming]
    payload: []
    valid_responses: [ACK, NACK]
    success_effect: enter_idle_and_stop_telemetry

  - name: ACK
    id: 0x80
    direction: mcu_to_pc
    kind: response
    sequence_rule: copy_request_sequence
    payload:
      - name: request_message_id
        type: uint8
      - name: result_code
        type: uint8
        required_value: 0x00
      - name: device_state
        type: uint8

  - name: NACK
    id: 0x81
    direction: mcu_to_pc
    kind: response
    sequence_rule: copy_request_sequence
    payload:
      - name: request_message_id
        type: uint8
      - name: result_code
        type: uint8
      - name: device_state
        type: uint8

  - name: DEVICE_INFO
    id: 0x82
    direction: mcu_to_pc
    kind: response
    sequence_rule: copy_request_sequence
    payload:
      - name: device_type
        type: uint16
        poc_value: 0x4460
      - name: firmware_major
        type: uint8
      - name: firmware_minor
        type: uint8
      - name: firmware_patch
        type: uint8
      - name: maximum_stream_rate_hz
        type: uint16
      - name: device_name_length
        type: uint8
      - name: device_name
        type: utf8_byte_array
        size_bytes: device_name_length
        maximum_size_bytes: 32

  - name: DEVICE_STATUS
    id: 0x83
    direction: mcu_to_pc
    kind: response_or_event
    payload:
      - name: state
        type: uint8
      - name: status_flags
        type: uint16

  - name: TELEMETRY_SAMPLE
    id: 0x90
    direction: mcu_to_pc
    kind: event
    allowed_state: streaming
    payload:
      - name: sample_counter
        type: uint32
      - name: device_tick_us
        type: uint32
      - name: sine_value
        type: float32_ieee754
      - name: status_flags
        type: uint16
    payload_size_bytes: 14

  - name: ERROR_REPORT
    id: 0x91
    direction: mcu_to_pc
    kind: event
    payload:
      - name: error_code
        type: uint16
      - name: detail
        type: uint32

result_codes:
  - { name: OK, value: 0x00 }
  - { name: INVALID_COMMAND, value: 0x01 }
  - { name: INVALID_LENGTH, value: 0x02 }
  - { name: INVALID_VALUE, value: 0x03 }
  - { name: INVALID_STATE, value: 0x04 }
  - { name: UNSUPPORTED_VERSION, value: 0x05 }
  - { name: INTERNAL_ERROR, value: 0x06 }

status_flags:
  - { name: NONE, mask: 0x0000 }
  - { name: RX_OVERFLOW_OBSERVED, mask: 0x0001 }
  - { name: TX_OVERFLOW_OBSERVED, mask: 0x0002 }
  - { name: UART_ERROR_OBSERVED, mask: 0x0004 }

host_timeouts_ms:
  get_device_info: 1000
  command_default: 1000
  stop_stream: 1500
  partial_frame: 250

error_behavior:
  invalid_crc: discard_frame_without_response_and_resynchronize
  invalid_payload_length: discard_candidate_without_response_and_resynchronize
  unsupported_version: send_nack_when_request_header_is_decodable
  unknown_message_id: send_nack_when_request_is_decodable
  command_in_invalid_state: send_nack_invalid_state
  host_timeout: fail_command_without_assuming_device_state_change
  duplicate_response: ignore_after_first_matching_response
  unexpected_response_sequence: reject_as_unmatched_response

compatibility_rules:
  compatible_without_wire_version_change:
    - documentation_clarification_without_wire_change
    - addition_of_optional_host_behavior_not_sent_on_wire
    - addition_of_new_message_id_not_required_by_existing_peers
  requires_wire_version_change:
    - field_order_or_width_change
    - crc_algorithm_or_coverage_change
    - existing_message_payload_change
    - endian_change
    - reinterpretation_of_existing_id_or_result_code
