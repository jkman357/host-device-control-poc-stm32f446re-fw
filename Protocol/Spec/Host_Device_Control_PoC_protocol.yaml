protocol:
  name: Host Device Control PoC
  version: 0.1.0
  wire_version: 0x01
  byte_order: little_endian
  authority_rule: specification_precedes_implementation
framing:
  sof: [0xA5, 0x5A]
  fields:
    - {name: version, type: u8}
    - {name: message_id, type: u8}
    - {name: sequence, type: u16}
    - {name: payload_length, type: u16, maximum: 1024}
    - {name: payload, type: bytes}
    - {name: crc16, type: u16, algorithm: CRC-16-CCITT-FALSE}
commands:
  PING: {id: 0x01, payload: empty}
  GET_DEVICE_INFO: {id: 0x02, payload: empty}
  SET_STREAM_CONFIG: {id: 0x03, payload: {interval_us: {type: u16, minimum: 1000, maximum: 60000}}, allowed_state: IDLE}
  START_STREAM: {id: 0x04, payload: empty, allowed_state: IDLE}
  STOP_STREAM: {id: 0x05, payload: empty, allowed_state: STREAMING}
messages:
  ACK: {id: 0x80}
  NACK: {id: 0x81}
  DEVICE_INFO: {id: 0x82}
  DEVICE_STATUS: {id: 0x83, reserved: true}
  TELEMETRY_SAMPLE: {id: 0x90, payload: [sample_counter_u32, device_tick_us_u32, sine_float32, status_flags_u16]}
  ERROR_REPORT: {id: 0x91, reserved: true}
