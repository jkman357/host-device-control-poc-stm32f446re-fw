schema_version: "1.0"

document:
  name: Host_Device_Control_PoC_protocol
  version: V0.1.0
  status: draft
  owner: Ray Yang
  last_updated: 2026-07-25
  authoritative_file: Protocol/Spec/Host_Device_Control_PoC_protocol.yaml
  note: Human review and approval are required before this becomes a controlled baseline.

protocol:
  name: host_device_control_poc
  family: coordinator_node
  profile_name: STM32F446RE_UART_PoC
  profile_id: 0x0001
  version: V0.1.0
  minimum_compatible_version: V0.1.0
  default_execution_environment: application

node_model:
  topology: single_node
  maximum_nodes: 1
  maximum_online_nodes: 1
  identity:
    node_id_required: false
    uniqueness_scope: protocol_instance
    persistence: connection
  addressing:
    method: connection_bound
    address_assignment: not_applicable
    target_required_on_wire: false
    broadcast:
      supported: false
      response_policy: not_applicable
  multi_target:
    supported: false
    partial_failure_policy: not_applicable
  scope:
    protocol_session: connection
    secure_session: connection
    sequence: connection
    correlation: connection
  lifecycle:
    identity_conflict_policy: not_applicable
    address_reuse_requires_new_connection_generation: true
    address_reuse_requires_new_secure_session: false
  resources:
    maximum_pending_requests_per_node: 1
    maximum_total_pending_requests: 1
  firmware_update:
    target_scope: single_node
    concurrency: one_at_a_time
    maximum_parallel_updates: 1

wire_format:
  transport: USART2 through ST-LINK Virtual COM Port
  uart:
    baud_rate: 115200
    data_bits: 8
    parity: none
    stop_bits: 1
  byte_order: little_endian
  frame:
    sof: [0xA5, 0x5A]
    protocol_version:
      type: uint8
      value: 0x01
    message_id:
      type: uint16
    flags:
      type: uint8
    payload_length:
      type: uint8
      maximum: 48
    sequence:
      type: uint16
      behavior: modulo_65536
    payload:
      type: bytes
    crc:
      type: uint16
      algorithm: CRC-16-CCITT-FALSE
      polynomial: 0x1021
      initial_value: 0xFFFF
      reflect_input: false
      reflect_output: false
      xor_output: 0x0000
      coverage: protocol_version_through_payload
  flags:
    request: 0x01
    response: 0x02
    telemetry: 0x04

id_allocation:
  message_id_width_bits: 16
  ranges:
    - name: framework_health
      start: 0x0000
      end: 0x00FF
    - name: application_command_response
      start: 0x0100
      end: 0x0FFF
    - name: telemetry_stream
      start: 0x2000
      end: 0x2FFF
  reserved:
    - start: 0x1000
      end: 0x1FFF
    - start: 0x3000
      end: 0xFFFF

namespaces:
  - name: framework
    id: 0x0000
    purpose: health, identity, and protocol error handling
  - name: application
    id: 0x0001
    purpose: stream control and telemetry

services:
  - name: DEVICE_MANAGEMENT
    id: 0x0001
    namespace: framework
  - name: STREAM_CONTROL
    id: 0x0100
    namespace: application
  - name: DATA_ACQUISITION
    id: 0x0200
    namespace: application

enums:
  - name: DEVICE_STATE
    underlying_type: uint8
    values:
      IDLE: 0
      STREAMING: 1
      FAULT: 2
  - name: COMMAND_RESULT
    underlying_type: uint8
    values:
      OK: 0
      INVALID_STATE: 1
      UNSUPPORTED: 2
      INVALID_PAYLOAD: 3
      TRANSPORT_BUSY: 4

errors:
  - name: INVALID_STATE
    code: 1
    description: Request is not valid in the current device state.
  - name: UNSUPPORTED
    code: 2
    description: Message identifier or operation is not supported.
  - name: INVALID_PAYLOAD
    code: 3
    description: Payload length or content is invalid.
  - name: TRANSPORT_BUSY
    code: 4
    description: Response could not be queued by the bounded transport.

messages:
  - name: PING_REQUEST
    id: 0x0001
    namespace: framework
    service: DEVICE_MANAGEMENT
    category: command_request
    direction: coordinator_to_node
    flags: request
    payload_length: 0
    response: PING_RESPONSE
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: GET_DEVICE_INFO_REQUEST
    id: 0x0002
    namespace: framework
    service: DEVICE_MANAGEMENT
    category: command_request
    direction: coordinator_to_node
    flags: request
    payload_length: 0
    response: DEVICE_INFO_RESPONSE
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: ERROR_RESPONSE
    id: 0x00E0
    namespace: framework
    service: DEVICE_MANAGEMENT
    category: command_response
    direction: node_to_coordinator
    flags: response
    correlation: echoed_request_sequence
    payload:
      - {name: rejected_message_id, type: uint16, offset: 0}
      - {name: result, type: uint8, offset: 2, enum: COMMAND_RESULT}
      - {name: device_state, type: uint8, offset: 3, enum: DEVICE_STATE}
    payload_length: 4
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: PING_RESPONSE
    id: 0x0081
    namespace: framework
    service: DEVICE_MANAGEMENT
    category: command_response
    direction: node_to_coordinator
    flags: response
    correlation: echoed_request_sequence
    payload:
      - {name: uptime_ms, type: uint32, offset: 0, behavior: saturating}
      - {name: device_state, type: uint8, offset: 4, enum: DEVICE_STATE}
      - {name: protocol_version, type: uint8, offset: 5}
    payload_length: 6
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: DEVICE_INFO_RESPONSE
    id: 0x0082
    namespace: framework
    service: DEVICE_MANAGEMENT
    category: command_response
    direction: node_to_coordinator
    flags: response
    correlation: echoed_request_sequence
    payload:
      - {name: protocol_version, type: uint8, offset: 0}
      - {name: firmware_major, type: uint8, offset: 1}
      - {name: firmware_minor, type: uint8, offset: 2}
      - {name: firmware_patch, type: uint8, offset: 3}
      - {name: board_id, type: uint8, offset: 4}
      - {name: transport_id, type: uint8, offset: 5}
      - {name: sample_period_us, type: uint16, offset: 6}
      - {name: maximum_payload_length, type: uint8, offset: 8}
      - {name: capability_flags, type: uint8, offset: 9}
      - {name: reserved, type: uint16, offset: 10, required_value: 0}
    payload_length: 12
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: START_STREAM_REQUEST
    id: 0x0100
    namespace: application
    service: STREAM_CONTROL
    category: command_request
    direction: coordinator_to_node
    flags: request
    payload_length: 0
    valid_states: [IDLE]
    response: START_STREAM_RESPONSE
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: START_STREAM_RESPONSE
    id: 0x0101
    namespace: application
    service: STREAM_CONTROL
    category: command_response
    direction: node_to_coordinator
    flags: response
    correlation: echoed_request_sequence
    payload:
      - {name: result, type: uint8, offset: 0, enum: COMMAND_RESULT}
      - {name: device_state, type: uint8, offset: 1, enum: DEVICE_STATE}
    payload_length: 2
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: STOP_STREAM_REQUEST
    id: 0x0102
    namespace: application
    service: STREAM_CONTROL
    category: command_request
    direction: coordinator_to_node
    flags: request
    payload_length: 0
    valid_states: [STREAMING]
    response: STOP_STREAM_RESPONSE
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: STOP_STREAM_RESPONSE
    id: 0x0103
    namespace: application
    service: STREAM_CONTROL
    category: command_response
    direction: node_to_coordinator
    flags: response
    correlation: echoed_request_sequence
    payload:
      - {name: result, type: uint8, offset: 0, enum: COMMAND_RESULT}
      - {name: device_state, type: uint8, offset: 1, enum: DEVICE_STATE}
    payload_length: 2
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

  - name: TELEMETRY
    id: 0x2000
    namespace: application
    service: DATA_ACQUISITION
    category: stream
    direction: node_to_coordinator
    flags: telemetry
    payload:
      - {name: uptime_ms, type: uint32, offset: 0, behavior: saturating}
      - {name: sine_sample, type: int16, offset: 4}
      - {name: device_state, type: uint8, offset: 6, enum: DEVICE_STATE}
      - {name: status_flags, type: uint8, offset: 7}
      - {name: event_overflow_count, type: uint16, offset: 8, behavior: saturating}
      - {name: uart_rx_overflow_count, type: uint16, offset: 10, behavior: saturating}
      - {name: uart_tx_overflow_count, type: uint16, offset: 12, behavior: saturating}
    payload_length: 14
    sequence_policy:
      field: frame.sequence
      behavior: sample_attempt_modulo_65536
      loss_detection: gaps_are_detectable
    timestamp_policy:
      field: payload.uptime_ms
      unit: millisecond
      source: device_timebase
    delivery_policy: detectable_drop_allowed
    security:
      authentication_required: false
      encryption_required: false
      allowed_before_session: true
      privilege: laboratory_poc

compatibility:
  version_field: wire_format.frame.protocol_version
  current_wire_version: 0x01
  policy: exact_wire_version_for_poc
  unknown_message_policy: ERROR_RESPONSE_with_UNSUPPORTED
  unknown_flag_policy: reject_request
  trailing_payload_policy: reject
  sequence_wrap: modulo_65536

code_generation:
  status: manual_implementation
  authoritative_source: Protocol/Spec/Host_Device_Control_PoC_protocol.yaml
  generated_outputs: []
  checked_manual_outputs:
    - Protocol/Inc/protocol_messages.h
    - Protocol/Inc/protocol.h
  note: The repository validator checks message-ID consistency; it does not claim full code generation or semantic equivalence.
